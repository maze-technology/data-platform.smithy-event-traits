plugins {
  id("java-library")
  id("maven-publish")
}

group = "tech.maze"

repositories {
  mavenLocal()
  mavenCentral()
}

processResources {
  from("src/main/smithy") {
    include("**/*.smithy")
    into("META-INF/smithy")
  }
}

jar {
  enabled = true
  archiveClassifier = ""

  manifest {
    attributes(
      "Implementation-Title": project.name,
      "Implementation-Version": project.version,
    )
  }
}

java {
  withSourcesJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }

  repositories {
    maven {
      name = "gitlab"
      url = System.getenv("GITLAB_MAVEN_URL") ?: "https://scm.maze.trading/api/v4/groups/6/-/packages/maven"

      credentials {
        username = System.getenv("GITLAB_MAVEN_USER") ?: "gitlab-ci-token"
        password = System.getenv("CI_JOB_TOKEN") ?: System.getenv("GITLAB_MAVEN_PASSWORD") ?: System.getenv("GITLAB_TOKEN")
      }
    }
  }
}

tasks.register("printCoordinates") {
  doLast {
    println("group=${project.group}")
    println("artifactId=${project.name}")
  }
}
